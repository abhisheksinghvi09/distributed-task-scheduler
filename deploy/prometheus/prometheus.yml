global:
  scrape_interval: 5s

scrape_configs:
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:8081"]
  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:8082"]
  - job_name: worker
    static_configs:
      - targets: ["worker-1:8083", "worker-2:8083", "worker-3:8083"]
