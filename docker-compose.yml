services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: scheduler
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: coordinator
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      NATS_URL: nats://nats:4222
    ports:
      - "18082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      NATS_URL: nats://nats:4222
      WORKER_HTTP_ADDR: ":8083"
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-300}
      ALLOW_SHELL_TASKS: ${ALLOW_SHELL_TASKS:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      NATS_URL: nats://nats:4222
      WORKER_HTTP_ADDR: ":8083"
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-300}
      ALLOW_SHELL_TASKS: ${ALLOW_SHELL_TASKS:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      NATS_URL: nats://nats:4222
      WORKER_HTTP_ADDR: ":8083"
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-300}
      ALLOW_SHELL_TASKS: ${ALLOW_SHELL_TASKS:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - scheduler
      - coordinator

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
